# ========== Principal ==========
server {
    listen 443 ssl;
	listen [::]:443 ssl;
    server_name literae.ch www.literae.ch;
    include /etc/nginx/literae-art-media.inc;

	http2 on;

    # certbot
    ssl_certificate /etc/letsencrypt/live/literae.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/literae.ch/privkey.pem; # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # /art → sous-domaine
    location = /art {
        return 301 https://art.literae.ch/;
    }
    location /art/ {
        return 301 https://art.literae.ch$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


}

# ========== Galerie ==========
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name art.literae.ch;

	http2 on;

    include /etc/nginx/literae-art-media.inc;
    ssl_certificate /etc/letsencrypt/live/literae.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/literae.ch/privkey.pem; # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Assets Astro : PAS de rewrite
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # accueil galerie uniquement
    location = / {
        rewrite ^ /art/ break;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }    

}

# ========== Directus ==========
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.literae.ch;
    ssl_certificate /etc/letsencrypt/live/literae.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/literae.ch/privkey.pem; # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

	http2 on;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

# ========== HTTP → HTTPS (certbot peut régénérer ça) ==========
server {
    if ($host = api.literae.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = art.litaere.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.literae.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = literae.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name literae.ch www.literae.ch art.literae.ch api.literae.ch;
    return 301 https://$host$request_uri;
}
