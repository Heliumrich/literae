proxy_cache_path /var/cache/nginx/literae-art levels=1:2 keys_zone=literae_art:8m
                 max_size=1536m min_free=1536m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/literae-art-entry levels=1:2 keys_zone=literae_art_entry:8m
                 max_size=2560m min_free=1536m inactive=180d use_temp_path=off;

map $uri $literae_art_cache_zone {
    default literae_art;
    ~/(?:image\.dzi|thumb\.webp|preview\.webp)$ literae_art_entry;
    ~/image_files/(?:[0-9]|1[0-2])/ literae_art_entry;
}
